services:
  - type: web
    name: gng-video-maker
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install --only-binary=all --no-cache-dir -r requirements.txt
    startCommand: python app.py
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"