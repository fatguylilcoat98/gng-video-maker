services:
  - type: web
    name: gng-video-maker
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    buildCommand: echo "Building GNG Video Maker..."
    startCommand: python -m flask run --host=0.0.0.0 --port=8000
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      - key: PYTHONPATH
        value: /app
      - key: OPENAI_API_KEY
        sync: false  # Set this in Render dashboard
      - key: ELEVENLABS_API_KEY
        sync: false  # Set this in Render dashboard (optional)
      - key: ELEVENLABS_VOICE_ID
        sync: false  # Set this in Render dashboard (optional)
    healthCheckPath: /health
    autoDeploy: true
